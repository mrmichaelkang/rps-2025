<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <title>The Odin Project | Rock Paper Scissors</title>
</head>
<body>
  <h1>Rock Paper Scissors</h1>
  <div id="display">
    <p>User Score: <span class="user-score">0</span></p>
    <p class="info-text">Welcome to Rock, Paper, Scissors! Please select your option to begin!</p>
    <p>CPU Score: <span class="cpu-score">0</span></p>
  </div>
  <div id="options">
    <button class="btn" id="Rock">✊</button>
    <button class="btn" id="Paper">✋</button>
    <button class="btn" id="Scissors">✌️</button>
  </div>
  <button class="reset hide">Reset</button>
  <script src="script.js"></script>
</body>
</html>
